name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 用 runner 自带的 Android SDK（不再用 setup-android，它会去装已被删除的 tools 包）
      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release || echo "flutter exited $?"

      - name: Collect APKs
        run: |
          echo "--- 全仓库 apk ---"
          find . -name "*.apk" -type f -print
          mkdir -p out
          find . -name "*.apk" -type f -exec cp -v {} out/ \; || true
          echo "--- out ---"
          ls -la out || true
          test -n "$(ls -A out 2>/dev/null)" || (echo "没有产物" && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-crt-apk
          path: out/*.apk
          if-no-files-found: error
